      summary: Directors/admins only. The three companies side by side plus the consolidated total (Σ companies − intercompany),
        league table, 13-month trend per company, all in USD. Other /reports/* endpoints take `entityId` (must be in scope).
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
