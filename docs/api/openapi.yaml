          description: '{ range, total, byEntity: {entityId: kpis}, lessIntercompany: {revenue, cases, sales}, league[], trend[], fxBasis }.
            KPIs: revenue, cases, cogs, grossMargin, marginPct, stockValue, stockCases, stockTurns, onTimePct, deliveries,
            receivables, cashCollected, transportSpend, landingCostPerCase.'
        4XX:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    entityHeader:
      name: X-Entity-Id
      in: header
      description: Active company (entity id); omit or GROUP for every allowed company. Outside the allowed set → 403.
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    since:
      name: since
      in: query
      schema:
        type: string
        format: date-time
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    status:
      name: status
      in: query
      schema:
        type: string
    idem:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        code:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        phone:
          type: string
        pin:
          type: string
        deviceId:
          type: string
        platform:
          type: string
        appVersion:
          type: string
    Session:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
        expiresIn:
          type: integer
        deviceId:
          type: string
    Role:
      enum:
      - director
      - planner
      - operations
      - loader
      - fleet
      - receiver
      - sales
      - accounts
      - driver
      - admin
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        entityIds:
          type: array
          items:
            type: string
        loadingPointIds:
          type: array
          items:
            type: string
        warehouseIds:
          type: array
          items:
            type: string
        allowedEntityIds:
          type: array
          description: Companies the user may work in (directors/admins and drivers — all).
          items:
            type: string
        canGroup:
          type: boolean
          description: May use the Group view and /reports/group (directors, admins).
        activeEntityId:
          type:
          - string
          - 'null'
          description: From X-Entity-Id (/me only).
        scope:
          type: array
          description: Companies this request covers (/me only).
          items:
            type: string
    Entity:
      type: object
      description: A sibling company (tenant). Placeholders read "… — to confirm".
      properties:
        id:
          type: string
        code:
          type: string
          description: BTW | NUD | KVD — picks the brand kit (packages/ui/src/assets/brand/entities/<code>/).
        name:
          type: string
          description: Legal name
        shortName:
          type: string
          description: Trading name
        poPrefix:
          type: string
        address:
          type: array
          items:
            type: string
        phones:
          type: array
          items:
            type: string
        email:
          type: string
        website:
          type: string
        tagline:
          type: string
        footerLine:
          type: string
        colors:
          type: object
          properties:
            primary:
              type: string
            accent:
              type: string
            ink:
              type: string
        logoKey:
          type: string
        kraPin:
          type: string
        registrationNo:
          type: string
        registeredOffice:
          type: string
        reportingCurrency:
          type: string
        letterhead:
          type: object
          properties:
            header:
              type: string
            footer:
              type: string
            watermark:
              type: string
    FxRate:
      type: object
      required: [currency, month, avg, closing]
      properties:
        currency:
          type: string
          description: KES, UGX, TZS, RWF … (not USD)
        month:
          type: string
          description: YYYY-MM
        avg:
          type: number
          description: Month-average rate, units per 1 USD (P&L, costs, payments)
        closing:
          type: number
          description: Month-end rate, units per 1 USD (stock, balances)
    RefBundle:
      type: object
      description: See types.ts (Entity
      Supplier: null
      Product: null
      PriceListItem: null
      Provider: null
      Truck: null
      Driver: null
      Checkpoint: null
      Route: null
      Warehouse: null
      ReceivingCompany): null
    Checkpoint:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          enum:
          - loading
          - weighbridge
          - town
          - border
          - warehouse
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        radiusM:
          type: integer
        code:
          type: string
        aliases:
          type: array
          items:
            type: string
    RouteStop:
      type: object
      properties:
        checkpointId:
          type: string
        plannedHours:
          type: number
        plannedDwellHours:
          type: number
    PeriodPlanLine:
      type: object
      required: [supplierId, productId, cases, price, destinationId]
      properties:
        id: {type: string}
        supplierId: {type: string}
        productId: {type: string}
        cases: {type: integer, minimum: 1}
        price: {type: number}
        destinationId: {type: string, description: 'Destination warehouse (e.g. w-kgl = Rwanda - Gisenyi)'}
        months: {type: object, additionalProperties: {type: integer}, description: 'Optional split by month (YYYY-MM to cases); must add up to cases'}
    PeriodPlan:
      type: object
      properties:
        id: {type: string}
        ref: {type: string, example: BTW-PP-2026-0001}
        entityId: {type: string}
        title: {type: string}
        periodKind: {type: string, enum: [month, quarter, half, year, custom]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        status: {type: string, enum: [Draft, Submitted, Approved, Returned, Rejected]}
        version: {type: integer}
        lines: {type: array, items: {$ref: '#/components/schemas/PeriodPlanLine'}}
        history: {type: array, items: {type: object}}
        createdById: {type: string}
        copiedFromId: {type: string}
        amendReason: {type: string}
    PvThresholds:
      type: object
      properties:
        behind: {type: number, example: 0.85, description: 'Behind plan if ordered < behind x expected to date'}
        over: {type: number, example: 1.05, description: 'Over plan if ordered > over x planned'}
    PlanLine:
      type: object
      required:
      - truckNo
      - productId
      - qty
      - price
      - deliveredToId
      - routeId
      properties:
        id:
          type: string
        truckNo:
          type: integer
          minimum: 1
        productId:
          type: string
        qty:
          type: integer
          minimum: 0
        price:
          type: number
        amount:
          type: number
          readOnly: true
        deliveredToId:
          type: string
        routeId:
          type: string
        periodLineId:
          type: string
          description: PO-06 linked period-plan line (set by the server)
        exception:
          type: string
          enum: [over, unplanned]
          readOnly: true
        exceptionReason:
          type: string
          description: PO-07 required before submit when the line is over plan or unplanned
    Plan:
      type: object
      properties:
        id:
          type: string
        ref:
          type: string
          readOnly: true
          examples:
          - BTW-PO-2026-0002
        title:
          type: string
        entityId:
          type: string
        supplierId:
          type: string
        currency:
          enum:
          - USD
          - KES
        date:
          type: string
          format: date
        requiredBy:
          type: string
          format: date
        status:
          enum:
          - Draft
          - Submitted
          - Approved
          - Returned
          - Rejected
        version:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PlanLine'
        totals:
          type: object
          readOnly: true
          properties:
            qty:
              type: integer
            amount:
              type: number
            byTruck:
              type: array
              items:
                type: object
            byProduct:
              type: array
              items:
                type: object
        history:
          type: array
          items:
            type: object
        poId:
          type: string
    PlanPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        next:
          type: string
    Decision:
      type: object
      required:
      - action
      properties:
        action:
          enum:
          - approved
          - returned
          - rejected
        comment:
          type: string
        signatureFileId:
          type: string
    WaitingEntry:
      type: object
      properties:
        id:
          type: string
        loadingPointId:
          type: string
        truckId:
          type: string
        driverId:
          type: string
        arrivedAt:
          type: string
          format: date-time
        position:
          type: integer
        status:
          enum:
          - Waiting
          - Assigned
          - Loaded
    LoadingConfirm:
      type: object
      required:
      - truckId
      - driverId
      - loadedQty
      - agreedTransport
      properties:
        truckId:
          type: string
        driverId:
          type: string
        loadedQty:
          type: object
          additionalProperties:
            type: integer
        agreedTransport:
          type: number
        transportCurrency:
          type: string
        documentFileIds:
          type: array
          items:
            type: string
        loadedAt:
          type: string
          format: date-time
    PassEvent:
      type: object
      required:
      - checkpointId
      - kind
      - source
      properties:
        checkpointId:
          type: string
        kind:
          enum:
          - arrived
          - departed
        source:
          enum:
          - driver
          - geofence
          - gps-provider
          - sms
          - office
        at:
          type: string
          format: date-time
          description: Device time; server stores both
    TruckIssue:
      type: object
      properties:
        checkpointId:
          type: string
        place:
          type: string
        reason:
          type: string
        at:
          type: string
          format: date-time
        fixedAt:
          type: string
          format: date-time
        newDueDate:
          type: string
          format: date-time
    Eta:
      type: object
      properties:
        state:
          enum:
          - Early
          - On time
          - Late
        hours:
          type: integer
        eta:
          type: string
          format: date-time
        nextCheckpointId:
          type: string
    Leg:
      type: object
      properties:
        id:
          type: string
        seq:
          type: integer
        routeId:
          type: string
        fromId:
          type: string
        toId:
          type: string
        truckId:
          type: string
        driverId:
          type: string
        status:
          enum:
          - Planned
          - Loaded
          - Dispatched
          - In transit
          - At border
          - Arrived
          - Acknowledged
          - Delayed
          - Cancelled
        plannedArrival:
          type: string
          format: date-time
        passes:
          type: array
          items:
            type: object
            properties:
              checkpointId:
                type: string
              plannedAt:
                type: string
              arrivedAt:
                type: string
              departedAt:
                type: string
              source:
                type: string
        eta:
          $ref: '#/components/schemas/Eta'
        lines:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              loadedQty:
                type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/TruckIssue'
    WarehouseInput:
      type: object
      properties:
        name: { type: string }
        country: { type: string, example: Congo }
        town: { type: string, example: Bukavu }
        receivingCompanyId: { type: string }
        lat: { type: number }
        lng: { type: number }
        radiusM: { type: integer, default: 500 }
        active: { type: boolean, default: true }
    Shipment:
      type: object
      properties:
        id:
          type: string
        parentShipmentId:
          type: string
          nullable: true
          description: The shipment whose received goods this one carries on (doc 08 §2)
        originShipmentId:
          type: string
          nullable: true
        fromWarehouseId:
          type: string
          nullable: true
        plannedWarehouseId:
          type: string
          nullable: true
          description: Original destination when the goods were received at an intermediate warehouse
        ref:
          type: string
        poId:
          type: string
        truckNo:
          type: integer
        receivingCompanyId:
          type: string
        warehouseId:
          type: string
        status:
          type: string
          description: Derived from legs (DS-05)
        legs:
          type: array
          items:
            $ref: '#/components/schemas/Leg'
    AckInput:
      type: object
      required:
      - receiverName
      - lines
      properties:
        receiverName:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              expected:
                type: integer
              received:
                type: integer
              damaged:
                type: integer
              remarks:
                type: string
        signatureFileId:
          type: string
        photoFileIds:
          type: array
          items:
            type: string
        at:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        truckId:
          type: string
        lat:
          type: number
        lng:
          type: number
        at:
          type: string
          format: date-time
        speedKmh:
          type: number
        accuracyM:
          type: number
        source:
          enum:
          - app
          - gps-provider
    StockRow:
      type: object
      properties:
        warehouseId:
          type: string
        productId:
          type: string
        opening:
          type: integer
        received:
          type: integer
        transfersIn:
          type: integer
        transfersOut:
          type: integer
        damaged:
          type: integer
        adjustments:
          type: integer
        sold:
          type: integer
        closing:
          type: integer
        inTransit:
          type: integer
        landedCostPerCase:
          type: number
    VelocityRow:
      type: object
      properties:
        productId:
          type: string
        warehouseId:
          type: string
        sold30:
          type: integer
        perDay:
          type: number
        index:
          type: integer
        cover:
          type: integer
        daysSinceSale:
          type: integer
        cls:
          enum:
          - Fast
          - Normal
          - Slow
          - Stagnant
        flags:
          type: array
          items:
            enum:
            - slow-moving
            - overstock
            - stock-out-risk
            - dead-stock
            - cross-compare
    OutboxItem:
      type: object
      required:
      - idempotencyKey
      - op
      - payload
      - createdAt
      properties:
        idempotencyKey:
          type: string
          format: uuid
        op:
          enum:
          - leg.pass
          - leg.issue
          - leg.issue.fix
          - issue.fix
          - leg.acknowledge
          - leg.dispatch
          - loading.confirm
          - waiting.add
          - sale.create
          - positions
        payload:
          type: object
        createdAt:
          type: string
          format: date-time
    DriverWork:
      type: object
      properties:
        driver:
          type: object
        trips:
          type: array
          items: &id002
            type: object
            description: 'LegView in packages/api/src/types.ts: shipment, leg, route, checkpoints, truck, driver, eta, dwell, overdue'
    GiverWork:
      type: object
      properties:
        loadingPoints:
          type: array
        waiting:
          type: array
          items:
            $ref: '#/components/schemas/WaitingEntry'
        toLoad:
          type: array
        handover:
          type: array
          items: *id002
    ReceiverWork:
      type: object
      properties:
        warehouses:
          type: array
        incoming:
          type: array
          items: *id002
