openapi: 3.1.0
info:
  title: BTW Supply Chain API
  version: 0.2.0
  description: 'Contract between the web app, the field app and the backend. Implemented by apps/api; mirrors the

    client (`packages/api/src/index.ts`) and types (`packages/api/src/types.ts`) — keep names in sync.

    All business rules run on the server (§12). Every write is audited with user, time and channel

    (`X-Channel: web|app|sms`). Every list is filtered by the caller''s scopes (entity, loading point,

    warehouse, receiving company — UA-02, §17.7).

    Mobile writes carry `Idempotency-Key`; apps send `X-App-Version` and receive 426 when too old (MA-11).

    Companies (tenants): BTW, NUD and Kivu (KVD). `X-Entity-Id: <entity id>` picks the active company; without it (or
    `GROUP`) a request covers every company the user may work in (`/me` → allowedEntityIds; directors/admins: all).
    A company outside the allowed set → 403. Every list, report and write is limited to that scope; another company''s
    record by id → 404. A new record in a multi-company scope must name its `entityId` (else 422 entity-required).
    Amounts in reports are USD at the director-approved rates (`/settings/fx`).

    '
servers:
- url: https://api.example.com/v1
security:
- bearer: []
tags:
- name: auth
- name: users
- name: masterdata
- name: planning
- name: po
- name: loading
- name: shipments
- name: tracking
- name: acknowledgement
- name: field
- name: inventory
- name: sales
- name: finance
- name: analytics
- name: notifications
- name: sync
- name: integrations
- name: dev
- name: companies
- name: reports
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Password (web) or PIN (app) login. Body {username,password} | {phone|username,pin}, optional deviceId/platform/appVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        4XX:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate refresh token (reuse of an old token revokes the device session)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        4XX:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      security: []
  /auth/logout:
    post:
      tags:
      - auth
      summary: Revoke this device’s refresh tokens
      responses:
        '204':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /auth/demo-users:
    get:
      tags:
      - auth
      summary: Users for demo sign-in pickers (404 in production)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      security: []
  /auth/devices/{id}/revoke:
    post:
      tags:
      - auth
      summary: 'Remote logout of a lost device (MA-08): own device, or admin/director'
      responses:
        '204':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - &id001
        $ref: '#/components/parameters/id'
  /me:
    get:
      tags:
      - auth
      summary: Current user with roles and scopes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        4XX:
          $ref: '#/components/responses/Problem'
  /devices:
    post:
      tags:
      - notifications
      summary: Register this device’s push token + app version
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken:
                  type: string
                platform:
                  type: string
                appVersion:
                  type: string
  /notifications:
    get:
      tags:
      - notifications
      summary: Notifications for my roles with read state
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /notifications/read:
    post:
      tags:
      - notifications
      summary: Mark read (ids) or all
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
  /ref:
    get:
      tags:
      - masterdata
      summary: Reference bundle (entities, suppliers, products, prices, providers, trucks, drivers, checkpoints with code/aliases, routes, warehouses, receiving companies, users, settings).
        ETag / If-None-Match → 304
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefBundle'
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/{kind}:
    get:
      tags:
      - masterdata
      summary: One list from the bundle (kebab-case kind)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
  /masterdata/trucks:
    post:
      tags:
      - masterdata
      summary: Add truck (planner/fleet/admin)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/drivers:
    post:
      tags:
      - masterdata
      summary: Add driver (planner/fleet/admin)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/providers:
    post:
      tags:
      - masterdata
      summary: Add provider (planner/fleet/admin)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/warehouses:
    post:
      tags:
      - masterdata
      summary: Add a warehouse (admin/director) — its geofence becomes a warehouse checkpoint (doc 08 §3)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: The warehouse
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/warehouses/{id}:
    patch:
      tags:
      - masterdata
      summary: Edit or deactivate a warehouse (admin/director); any WarehouseInput field
      parameters:
      - *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '200':
          description: The warehouse
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/routes:
    post:
      tags:
      - masterdata
      summary: Add a route (planner/fleet/admin/director) — checkpoints in order, hours increasing; may end at a new warehouse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, stops]
              properties:
                name: { type: string }
                code: { type: string }
                distanceKm: { type: integer }
                stops:
                  type: array
                  items:
                    $ref: '#/components/schemas/RouteStop'
      responses:
        '201':
          description: The route
        4XX:
          $ref: '#/components/responses/Problem'
  /masterdata/routes/{id}:
    patch:
      tags:
      - masterdata
      summary: Update planned hours / dwell per stop (order fixed; must increase)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stops:
                  type: array
                  items:
                    $ref: '#/components/schemas/RouteStop'
  /users:
    get:
      tags:
      - users
      summary: List users (admin/director)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - users
      summary: Create user with roles + scopes, optional password/PIN
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /users/{id}:
    patch:
      tags:
      - users
      summary: Update roles/scopes/active (invalidates sessions)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /users/{id}/secret:
    post:
      tags:
      - users
      summary: Set PIN (4–6 digits) or password (≥8)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /users/{id}/devices:
    get:
      tags:
      - users
      summary: Devices of a user
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /plans:
    get:
      tags:
      - planning
      summary: Plans in my entity scope
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - planning
      summary: Create draft; ref auto-numbered per entity/year
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        4XX:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - entityId
              - supplierId
              properties:
                entityId:
                  type: string
                supplierId:
                  type: string
  /plans/{id}:
    get:
      tags:
      - planning
      summary: Plan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
    put:
      tags:
      - planning
      summary: Save draft/returned plan; 409 when locked; prices from price list unless director
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
  /plans/{id}/submit:
    post:
      tags:
      - planning
      summary: Submit for approval (notifies directors by push + email)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /plans/{id}/decision:
    post:
      tags:
      - planning
      summary: 'Director: approve (signature required → PO + loadings) / return / reject (comment required)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
  /plans/{id}/amendments:
    post:
      tags:
      - planning
      summary: Reopen approved plan as next version with reason (PL-04)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /plans/{id}/versions:
    get:
      tags:
      - planning
      summary: Approved version snapshots
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /plans/{id}/plan-context:
    get:
      tags:
      - planning
      summary: "PO-06: each order line against the approved period plan (planned, ordered before, this PO, remaining, over/unplanned)"
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans:
    get:
      tags:
      - planning
      summary: "Period plans of the caller's companies (feature period-plans)"
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - planning
      summary: "Create a draft period plan (planner/director; Group view must name entityId)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                periodKind:
                  type: string
                from:
                  type: string
                to:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
  /period-plans/overlaps:
    post:
      tags:
      - planning
      summary: "PL-12: plans of the same company and supplier overlapping in time"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodPlan'
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /period-plans/{id}:
    get:
      tags:
      - planning
      summary: "Period plan"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - planning
      summary: "Save a draft/returned period plan (lines, optional monthly split)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodPlan'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans/{id}/submit:
    post:
      tags:
      - planning
      summary: "Submit for director approval (validated: lines, split adds up)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans/{id}/decision:
    post:
      tags:
      - planning
      summary: "Director approves (signature + stamp), returns or rejects"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                comment:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans/{id}/amendments:
    post:
      tags:
      - planning
      summary: "PL-10: reopen an approved plan as the next version (reason required)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans/{id}/copy:
    post:
      tags:
      - planning
      summary: "PL-11: start a new draft from this plan for another period"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodPlan'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /period-plans/{id}/versions:
    get:
      tags:
      - planning
      summary: "Approved version snapshots"
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /reports/planned-vs-actual:
    get:
      tags:
      - reports
      summary: "PV-01..07: planned vs actual ordered, flags, monthly running totals, plan used per brand (usedPct is a percentage)"
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: from
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          type: string
      - name: entityId
        in: query
        schema:
          type: string
      - name: supplierId
        in: query
        schema:
          type: string
      - name: productId
        in: query
        schema:
          type: string
  /settings/pv-thresholds:
    get:
      tags:
      - reports
      summary: "Planned-vs-actual flag thresholds"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvThresholds'
        4XX:
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - reports
      summary: "Directors set thresholds (behind in (0,1], over in [1,2])"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvThresholds'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvThresholds'
        4XX:
          $ref: '#/components/responses/Problem'
  /pos:
    get:
      tags:
      - po
      summary: POs (entity scope or own loading point)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /pos/{id}:
    get:
      tags:
      - po
      summary: '{ po, plan }'
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /pos/{id}/sent:
    post:
      tags:
      - po
      summary: Record sent
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /pos/{id}/send:
    post:
      tags:
      - po
      summary: Email PDF letter to supplier export section + record sent (PO-03)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /pos/{id}/pdf:
    get:
      tags:
      - po
      summary: Typst PO letter
      responses:
        '200':
          description: PDF
          content:
            application/pdf: {}
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /pos/{id}/letter:
    get:
      tags:
      - po
      summary: PoLetterData used for the PDF (preview)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /waiting:
    get:
      tags:
      - loading
      summary: 'Waiting list entries (scope: my loading points)'
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: loadingPointId
        in: query
        schema:
          type: string
  /loading-points/{id}/waiting:
    post:
      tags:
      - loading
      summary: Queue a known truck (409 if already queued)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      - $ref: '#/components/parameters/idem'
  /loading-points/{id}/market-trucks:
    post:
      tags:
      - loading
      summary: Register a market truck + driver and queue it (§17.4)
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /waiting/{id}/move:
    post:
      tags:
      - loading
      summary: Move up (-1) / down (1)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /waiting/{id}:
    delete:
      tags:
      - loading
      summary: Remove from queue
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /loadings:
    get:
      tags:
      - loading
      summary: 'Loadings (scope: my loading points)'
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /loadings/{id}/confirm:
    post:
      tags:
      - loading
      summary: Record loading → shipment + first leg + transport cost; 422 over capacity / missing price; SMS to drivers without the app
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      - $ref: '#/components/parameters/idem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadingConfirm'
  /shipments:
    get:
      tags:
      - shipments
      summary: Shipments in scope (status derived; includes poRef)
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
  /shipments/{id}:
    get:
      tags:
      - shipments
      summary: Shipment with legs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /shipments/{id}/acks:
    get:
      tags:
      - shipments
      summary: Acknowledgements
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /shipments/{id}/legs:
    post:
      tags:
      - shipments
      deprecated: true
      summary: Deprecated — same as send-on; returns the NEW shipment's first leg
      responses:
        '201':
          description: OK
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
  /shipments/{id}/send-on:
    post:
      tags:
      - shipments
      summary: Send goods on from the warehouse where this shipment was received, as a NEW shipment (doc 08 §2)
      description: The route must start at that warehouse and end at an active warehouse. Lines default to the good quantity acknowledged (received − damaged). Stock leaves the warehouse now (transferOut) and posts into the next one on acknowledgement (transferIn). 422 if more than in stock.
      responses:
        '201':
          description: The new shipment (parentShipmentId / originShipmentId / fromWarehouseId set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        4XX:
          $ref: '#/components/responses/Problem'
      parameters:
      - *id001
      - $ref: '#/components/parameters/idem'
      requestBody:
